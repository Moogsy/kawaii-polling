<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
</head>
<body>
  {% if resume %}
    <h2>Welcome back, {{ session.rater }}!</h2>
    <p>You’re on image {{ session.index + 1 }} of {{ session.images|length }}.</p>
    <form action="{{ url_for('rate') }}" method="get">
      <button type="submit">Resume</button>
    </form>
    <hr>
    <form action="{{ url_for('restart') }}" method="post">
      <button type="submit">Start Over</button>
    </form>
  {% else %}
    <h2>Enter your name to begin</h2>
    {% if error %}
      <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post">
      <input type="text" name="rater" placeholder="Your name" required>
      <button type="submit">Start</button>
    </form>
  {% endif %}
</body>
</html>
