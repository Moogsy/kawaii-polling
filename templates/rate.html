<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate the Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      overflow: hidden; /* hide overflow for the viewport */
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* Top half: image area fills exactly 50% of viewport */
    .top {
      height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      background: #f9f9f9;
    }
    .top img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* Bottom half: form + button area fills remaining 50% */
    .bottom {
      height: 50vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollable form occupies most of bottom half */
    .form-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px;
    }
    .scale-section {
      margin-bottom: 12px;
    }
    .scale-label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }
    .likert-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.9rem;
    }
    .likert-row label {
      white-space: nowrap;
    }

    /* Next button at bottom of bottom half */
    .button-container {
      flex: 0 0 auto;
      text-align: center;
      border-top: 1px solid #ddd;
      padding: 8px 0;
      background: #fff;
    }
    .button-container button {
      padding: 8px 16px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <!-- Image occupies top half -->
      <img src="{{ url_for('static', filename=image) }}" alt="Rating Image">
    </div>

    <div class="bottom">
      <div class="form-scroll">
        <h2 style="text-align:center; margin:4px 0; font-size:1.1rem;">Image {{ index }} of {{ total }}</h2>
        <form id="rating-form" method="POST" action="{{ url_for('submit') }}">
          {% for scale in scales %}
            <div class="scale-section">
              <span class="scale-label">{{ scale }}</span>
              <div class="likert-row">
                {% for label in likert %}
                  <label>
                    <input type="radio" name="{{ scale }}" value="{{ loop.index }}" required>
                    {{ label }}
                  </label>
                {% endfor %}
              </div>
            </div>
          {% endfor %}
        </form>
      </div>
      <div class="button-container">
        <button type="submit" form="rating-form">Next</button>
      </div>
    </div>
  </div>
</body>
</html>
