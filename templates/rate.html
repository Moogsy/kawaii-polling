<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate the Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h2 {
      text-align: center;
      margin: 8px 0;
      font-size: 1.1rem;
      flex: 0 0 auto;
    }

    .image-container {
      flex: 0 0 auto;
      max-height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .image-container img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .form-container {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0 8px;
    }

    .scale-section {
      margin-bottom: 16px;
    }

    .scale-label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .likert-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
    }

    .likert-row label {
      white-space: nowrap;
    }

    .button-container {
      flex: 0 0 auto;
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 8px 0;
      display: flex;
      justify-content: center;
    }

    .button-container button {
      padding: 8px 16px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Image {{ index }} of {{ total }}</h2>

    <div class="image-container">
      <img src="{{ url_for('static', filename=image) }}" alt="Rating Image">
    </div>

    <div class="form-container">
      <form id="rating-form" method="POST" action="{{ url_for('submit') }}">
        {% for scale in scales %}
          <div class="scale-section">
            <div class="scale-label">{{ scale }}</div>
            <div class="likert-row">
              {% for label in likert %}
                <label>
                  <input type="radio" name="{{ scale }}" value="{{ loop.index }}" required>
                  {{ label }}
                </label>
              {% endfor %}
            </div>
          </div>
        {% endfor %}
      </form>
    </div>

    <div class="button-container">
      <button type="submit" form="rating-form">Next</button>
    </div>
  </div>
</body>
</html>
