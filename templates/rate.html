<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate the Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      overflow: hidden;
    }

    .container {
      display: grid;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      width: 100%;
    }

    /* Top half: header + image */
    .top {
      display: grid;
      grid-template-rows: auto 1fr;
      align-items: start;
      justify-items: center;
      padding: 8px;
      overflow: hidden;
    }
    .top h2 {
      margin: 4px 0;
      font-size: 1.1rem;
    }
    .top .image-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .top .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Bottom half: form + button */
    .bottom {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .bottom .form-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 8px;
    }
    .scale-section { margin-bottom: 12px; }
    .scale-label { font-weight: bold; margin-bottom: 6px; }
    .likert-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
    }
    .likert-row label { white-space: nowrap; }
    .bottom .button-container {
      padding: 8px 0;
      text-align: center;
      border-top: 1px solid #ddd;
      background: #fff;
    }
    .bottom .button-container button {
      padding: 8px 16px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h2>Image {{ index }} of {{ total }}</h2>
      <div class="image-container">
        <img src="{{ url_for('static', filename=image) }}" alt="Rating Image">
      </div>
    </div>

    <div class="bottom">
      <div class="form-scroll">
        <form id="rating-form" method="POST" action="{{ url_for('submit') }}">
          {% for scale in scales %}
            <div class="scale-section">
              <div class="scale-label">{{ scale }}</div>
              <div class="likert-row">
                {% for label in likert %}
                  <label>
                    <input type="radio" name="{{ scale }}" value="{{ loop.index }}" required>
                    {{ label }}
                  </label>
                {% endfor %}
              </div>
            </div>
          {% endfor %}
        </form>
      </div>
      <div class="button-container">
        <button type="submit" form="rating-form">Next</button>
      </div>
    </div>
  </div>
</body>
</html>
