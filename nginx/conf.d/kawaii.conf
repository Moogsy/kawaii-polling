##
# nginx/conf.d/kawaii.conf
# Domain: ekurea.art
##

############################  HTTP  ############################
server {
    listen 80;
    server_name ekurea.art;

    # --- ACME challenge files ---------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # <-- mounted from host
        try_files $uri =404;
    }

    # --- Everything else: force HTTPS -------------------------
    location / {
        return 301 https://$host$request_uri;
    }
}

############################ HTTPS #############################
server {
    listen 443 ssl http2;
    server_name ekurea.art;

    # --- TLS certificates (Let’s Encrypt) ---------------------
    ssl_certificate     /etc/letsencrypt/live/ekurea.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekurea.art/privkey.pem;

    # --- Recommended TLS settings -----------------------------
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Security headers (optional) --------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Proxy to Gunicorn container --------------------------
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

