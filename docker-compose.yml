version: '3.8'

services:
  web:
    build: .
    # Remove the host port 80 binding:
    #ports:
    #  - "80:8000"
    # Instead, either just expose 8000 internally:
    expose:
      - "8000"
    # ... rest unchanged
    volumes:
      - ./:/app
      - ./static/Pictures:/app/static/Pictures:ro
      - ./Ratings:/app/Ratings
    environment:
      - SECRET_KEY=${SECRET_KEY}
    command:
      - gunicorn
      - app:app
      - --bind=0.0.0.0:8000
      - --worker-class=gthread
      - --workers=1
      - --threads=4
      - --timeout=120
      - --graceful-timeout=30

