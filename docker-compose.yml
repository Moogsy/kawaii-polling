version: '3.8'

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app                           # your code & templates
      - ./static/Pictures:/app/static/Pictures:ro
      - ./Ratings:/app/Ratings
    environment:
      - SECRET_KEY=${SECRET_KEY}
    command:
      - gunicorn
      - app:app
      - --bind=0.0.0.0:8000
      - --worker-class=gthread
      - --workers=1
      - --threads=4
      - --timeout=120
      - --graceful-timeout=30

