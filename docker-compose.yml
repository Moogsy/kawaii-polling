# docker-compose.yml
version: '3.8'
services:
  web:
    build: .
    ports:
      - "80:8000"
    volumes:
      - ./:/app
      - ./Pictures:/app/Pictures
      - ./Ratings:/app/Ratings
    environment:
      - SECRET_KEY=${SECRET_KEY}
    command: >
      gunicorn app:app
        --bind 0.0.0.0:8000
        --worker-class gthread
        --workers 2
        --threads 2
        --timeout 120
        --graceful-timeout 30

